
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>النظام الأكاديمي | جامعة الإمام الشافعي</title>
    <meta name="description" content="البوابة الأكاديمية الإلكترونية لجامعة الإمام الشافعي" />
    <meta property="og:title" content="النظام الأكاديمي | جامعة الإمام الشافعي" />
    <meta property="og:description" content="البوابة الأكاديمية الإلكترونية لجامعة الإمام الشافعي" />
    
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-material-ui/material-ui.min.css" rel="stylesheet">
    
    <style>
      :root {
        --primary: #064E3B;
        --secondary: #D97706;
      }
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #F8FAFC;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      .font-mono, .tabular-nums {
        font-family: 'IBM Plex Mono', monospace;
        font-variant-numeric: tabular-nums;
      }
      
      /* Minimalist scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #E2E8F0; 
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #CBD5E1; 
      }
      
      /* Utilities */
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      /* Input AutoFill Fix */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          transition: background-color 5000s ease-in-out 0s;
      }
      
      /* SweetAlert2 RTL Fixes */
      div:where(.swal2-container) div:where(.swal2-popup) {
        font-family: 'Tajawal', sans-serif !important;
        border-radius: 24px !important;
        padding: 24px !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
      }
      .swal2-title {
        font-weight: 800 !important;
        color: #064E3B !important;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <!-- PENTING: Script entry point untuk Vite -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
