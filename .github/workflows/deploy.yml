name: Deploy SIAKAD ke cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build & Upload ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Production (Vite)
        run: npm run build

      - name: 5. Pastikan .htaccess Masuk ke Folder dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          ls -la dist/

      - name: 6. Upload Otomatis ke cPanel via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp dnsutils netcat-openbsd
          HOST_CLEAN=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|^http://||' -e 's|^https://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          USER_CLEAN=$(echo "$FTP_USER" | tr -d '[:space:]')

          echo "=========================================="
          echo "Memeriksa jalur koneksi ke FTP Server..."
          RESOLVED_IP=$(dig +short "$HOST_CLEAN" | tail -n1)
          if [ -z "$RESOLVED_IP" ]; then
            RESOLVED_IP="$HOST_CLEAN"
          fi
          echo "Target IP Server: $RESOLVED_IP"

          if echo "$RESOLVED_IP" | grep -Eq '^(104\.21\.|172\.67\.|104\.16\.|104\.17\.|104\.18\.|104\.19\.|104\.20\.)'; then
            echo "❌ ERROR: Secret FTP_SERVER masih mengarah ke IP Cloudflare ($RESOLVED_IP)!"
            echo "Cloudflare memblokir jalur FTP (Port 21)."
            echo "SOLUSI: Buka cPanel -> lihat panel kanan 'General Information' -> salin angka 'Shared IP Address', lalu masukkan angka IP tersebut ke GitHub Secret FTP_SERVER."
            exit 1
          fi

          if ! nc -zv -w 8 "$HOST_CLEAN" 21; then
            echo "❌ ERROR: Port 21 pada server ($RESOLVED_IP) tidak merespons / tertutup!"
            echo "Pastikan FTP_SERVER di GitHub Secrets diisi dengan 'Shared IP Address' asli dari cPanel."
            exit 1
          fi
          echo "✅ Port 21 terbuka! Memulai proses login & upload..."
          echo "=========================================="

          COMMON_MIRROR="mirror --reverse --delete --verbose --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .ftpquota --exclude-glob .htaccess.bak* ./dist/ ./"

          echo "--> [Mode 1/4] Mencoba FTPS Penuh (TLS Data + PASV IPv4 tanpa EPSV)..."
          if lftp -c "
            debug 5;
            set dns:order \"inet\";
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ftp:prefer-epsv no;
            set ftp:fix-pasv-address yes;
            set ftp:passive-mode on;
            set net:timeout 12;
            set net:max-retries 1;
            set net:reconnect-interval-base 2;
            open -u \"$USER_CLEAN\",\"$FTP_PASS\" -p 21 \"$HOST_CLEAN\";
            $COMMON_MIRROR;
            bye
          "; then
            echo "✅ Upload berhasil menggunakan Mode 1 (FTPS Penuh)!"
            exit 0
          fi

          echo "--> [Mode 2/4] Mencoba Plain FTP (Tanpa TLS + PASV IPv4 tanpa EPSV)..."
          if lftp -c "
            debug 5;
            set dns:order \"inet\";
            set ftp:ssl-allow no;
            set ftp:prefer-epsv no;
            set ftp:fix-pasv-address yes;
            set ftp:passive-mode on;
            set net:timeout 12;
            set net:max-retries 1;
            set net:reconnect-interval-base 2;
            open -u \"$USER_CLEAN\",\"$FTP_PASS\" -p 21 \"$HOST_CLEAN\";
            $COMMON_MIRROR;
            bye
          "; then
            echo "✅ Upload berhasil menggunakan Mode 2 (Plain FTP)!"
            exit 0
          fi

          echo "--> [Mode 3/4] Mencoba Upload Per-File via cURL (Bypass LIST directory)..."
          CURL_SUCCESS=true
          cd dist
          for FILE in $(find . -type f | sed 's|^\./||'); do
            echo "Mengunggah file: $FILE"
            if ! curl -sS --connect-timeout 10 --max-time 30 \
              --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              -k --ssl-reqd \
              --user "$USER_CLEAN:$FTP_PASS" \
              -T "$FILE" "ftp://$HOST_CLEAN:21/$FILE"; then
              if ! curl -sS --connect-timeout 10 --max-time 30 \
                --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
                --user "$USER_CLEAN:$FTP_PASS" \
                -T "$FILE" "ftp://$HOST_CLEAN:21/$FILE"; then
                CURL_SUCCESS=false
                break
              fi
            fi
          done
          cd ..
          if [ "$CURL_SUCCESS" = true ]; then
            echo "✅ Upload berhasil menggunakan Mode 3 (cURL Per-File)!"
            exit 0
          fi

          echo "--> [Mode 4/4] Mencoba FTP Active Mode (Tanpa Passive Port)..."
          if lftp -c "
            debug 5;
            set dns:order \"inet\";
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-protect-list yes;
            set ftp:passive-mode off;
            set net:timeout 12;
            set net:max-retries 1;
            open -u \"$USER_CLEAN\",\"$FTP_PASS\" -p 21 \"$HOST_CLEAN\";
            $COMMON_MIRROR;
            bye
          "; then
            echo "✅ Upload berhasil menggunakan Mode 4 (FTP Active Mode)!"
            exit 0
          fi

          echo "=========================================="
          echo "❌ Semua mode koneksi data FTP mengalami Timeout setelah Login (230 User logged in)."
          echo "Penyebab: Firewall server hosting memblokir rentang Passive Port pada ProFTPD."
          echo "=========================================="
          exit 1
