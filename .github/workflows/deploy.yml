name: Deploy SIAKAD ke cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build & Upload ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Production (Vite)
        run: npm run build

      - name: 5. Pastikan .htaccess Masuk ke Folder dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          ls -la dist/

      - name: 6. Upload Otomatis ke cPanel via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          HOST_CLEAN=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|/.*$||' | tr -d '[:space:]')
          USER_CLEAN=$(echo "$FTP_USER" | tr -d '[:space:]')
          echo "Menghubungkan ke FTP Server: $HOST_CLEAN ..."
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:passive-mode on;
            set net:timeout 25;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$USER_CLEAN\",\"$FTP_PASS\" -p 21 \"$HOST_CLEAN\";
            mirror --reverse --delete --verbose \
              --exclude-glob .well-known/ \
              --exclude-glob cgi-bin/ \
              --exclude-glob .ftpquota \
              --exclude-glob .htaccess.bak* \
              ./dist/ ./;
            bye
          "

