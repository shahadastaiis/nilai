name: Deploy SIAKAD ke cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build & Upload ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Production (Vite)
        run: npm run build

      - name: 5. Pastikan .htaccess Masuk ke Folder dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          ls -la dist/

      - name: 6. Upload Otomatis ke cPanel (Bypass Firewall Passive Port via HTTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SUBDOMAIN_URL: "https://nilai.stai-imamsyafii.ac.id/deploy.php"
        run: |
          HOST_CLEAN=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|^http://||' -e 's|^https://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          USER_CLEAN=$(echo "$FTP_USER" | tr -d '[:space:]')

          echo "=========================================="
          echo "Menyiapkan paket bundle (manifest.json) dari folder dist/..."
          node -e '
            const fs = require("fs");
            const path = require("path");
            const files = {};
            function walk(dir, base = "") {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                const rel = base ? base + "/" + entry.name : entry.name;
                if (entry.isDirectory()) {
                  walk(full, rel);
                } else if (rel !== "deploy.php") {
                  files[rel] = fs.readFileSync(full).toString("base64");
                }
              }
            }
            walk("dist");
            fs.writeFileSync("manifest.json", JSON.stringify({ files }));
            console.log("Total file siap kirim:", Object.keys(files).length);
          '

          echo "=========================================="
          echo "Mengirim pembaruan ke https://nilai.stai-imamsyafii.ac.id/deploy.php (Port 443 HTTPS)..."

          # Coba kirim langsung ke IP Server Asli (Port 443) maupun via Domain
          RESPONSE=""
          if [[ "$HOST_CLEAN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RESPONSE=$(curl -sS -k --connect-timeout 15 --max-time 60 \
              --resolve "nilai.stai-imamsyafii.ac.id:443:$HOST_CLEAN" \
              -F "user=$USER_CLEAN" \
              -F "pass=$FTP_PASS" \
              -F "manifest=@manifest.json" \
              "$SUBDOMAIN_URL" || true)
          fi

          if [[ "$RESPONSE" != *"DEPLOY_SUCCESS_OK"* ]]; then
            RESPONSE=$(curl -sS -k -L --connect-timeout 15 --max-time 60 \
              -F "user=$USER_CLEAN" \
              -F "pass=$FTP_PASS" \
              -F "manifest=@manifest.json" \
              "$SUBDOMAIN_URL" || true)
          fi

          echo "Respons Server: $RESPONSE"

          if [[ "$RESPONSE" == *"DEPLOY_SUCCESS_OK"* ]]; then
            echo "=========================================="
            echo "✅ DEPLOY OTOMATIS BERHASIL!"
            echo "Website SIAKAD sudah aktif di: https://nilai.stai-imamsyafii.ac.id"
            echo "=========================================="
            exit 0
          fi

          echo "=========================================="
          echo "⚠️ File jembatan 'deploy.php' belum ditemukan di folder nilai.stai-imamsyafii.ac.id"
          echo "Karena Firewall server hosting (103.157.146.130) memblokir Passive Port FTP (49152-65535),"
          echo "silakan buat 1 file bernama 'deploy.php' di cPanel -> File Manager -> folder nilai.stai-imamsyafii.ac.id"
          echo "dan tempel isi dari file public/deploy.php (hanya perlu dilakukan 1 kali saja)."
          echo "=========================================="
          exit 1

