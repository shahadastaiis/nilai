name: Deploy SIAKAD ke cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Upload ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Production (Vite)
        run: npm run build

      - name: 5. Pastikan .htaccess Masuk ke Folder dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          ls -la dist/

      - name: 6. Upload Otomatis ke cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/cgi-bin/**
