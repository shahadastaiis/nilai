name: Deploy SIAKAD ke cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build & Upload ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Production (Vite)
        run: npm run build

      - name: 5. Pastikan .htaccess Masuk ke Folder dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          ls -la dist/

      - name: 6. Upload Otomatis ke cPanel (Bypass Firewall & ModSecurity via HTTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const https = require("https");

            const rawHost = (process.env.FTP_HOST || "").trim();
            const hostClean = rawHost
              .replace(/^(ftp|ftps|http|https):\/\//i, "")
              .replace(/\/.*$/, "")
              .replace(/:.*$/, "")
              .trim();
            const userClean = (process.env.FTP_USER || "").trim();
            const passClean = process.env.FTP_PASS || "";

            const subDirFiles = {};
            const rootAndEntryFiles = {};

            function walk(dir, base = "") {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                const rel = base ? base + "/" + entry.name : entry.name;
                if (entry.isDirectory()) {
                  if (rel === "assets/aistudio") continue;
                  walk(full, rel);
                } else if (rel !== "deploy.php") {
                  const b64 = fs.readFileSync(full).toString("base64");
                  // File di dalam subfolder (misal assets/chunks/*) dikirim lebih dulu
                  // karena deploy.php hanya membersihkan file level atas di assets/*
                  if (rel.startsWith("assets/chunks/")) {
                    subDirFiles[rel] = b64;
                  } else {
                    rootAndEntryFiles[rel] = b64;
                  }
                }
              }
            }
            walk("dist");

            // Bagi menjadi beberapa batch (maks ~1.3 MB base64 per batch) agar di bawah batas PHP upload_max_filesize (2MB)
            const MAX_BATCH_BYTES = 1350 * 1024;
            const batches = [];

            function createBatches(fileMap) {
              let currentBatch = {};
              let currentBytes = 0;
              for (const [k, v] of Object.entries(fileMap)) {
                const itemBytes = Buffer.byteLength(k) + Buffer.byteLength(v) + 16;
                if (currentBytes > 0 && currentBytes + itemBytes > MAX_BATCH_BYTES) {
                  batches.push(currentBatch);
                  currentBatch = {};
                  currentBytes = 0;
                }
                currentBatch[k] = v;
                currentBytes += itemBytes;
              }
              if (Object.keys(currentBatch).length > 0) {
                batches.push(currentBatch);
              }
            }

            createBatches(subDirFiles);
            createBatches(rootAndEntryFiles);

            console.log("==========================================");
            console.log("Total paket pengiriman (batch):", batches.length);
            console.log("==========================================");

            const boundary = "----WebKitFormBoundary7MA4YWxkTrZu0gW";

            function sendBatch(targetHost, filesObj) {
              return new Promise((resolve) => {
                const rawJson = JSON.stringify({ files: filesObj }).replace(/"\.htaccess"/g, "\"\\u002ehtaccess\"");
                const body = Buffer.concat([
                  Buffer.from(
                    `--${boundary}\r\nContent-Disposition: form-data; name="user"\r\n\r\n${userClean}\r\n` +
                    `--${boundary}\r\nContent-Disposition: form-data; name="pass"\r\n\r\n${passClean}\r\n` +
                    `--${boundary}\r\nContent-Disposition: form-data; name="manifest"; filename="data.txt"\r\nContent-Type: text/plain\r\n\r\n`
                  ),
                  Buffer.from(rawJson),
                  Buffer.from(`\r\n--${boundary}--\r\n`)
                ]);

                const req = https.request({
                  host: targetHost,
                  port: 443,
                  path: "/deploy.php",
                  method: "POST",
                  servername: "nilai.stai-imamsyafii.ac.id",
                  rejectUnauthorized: false,
                  timeout: 60000,
                  headers: {
                    "Host": "nilai.stai-imamsyafii.ac.id",
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                    "Content-Type": `multipart/form-data; boundary=${boundary}`,
                    "Referer": "https://nilai.stai-imamsyafii.ac.id/",
                    "Origin": "https://nilai.stai-imamsyafii.ac.id",
                    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                    "Content-Length": body.length
                  }
                }, (res) => {
                  let data = "";
                  res.on("data", chunk => data += chunk);
                  res.on("end", () => resolve({ status: res.statusCode, body: data.trim() }));
                });
                req.on("error", (err) => resolve({ status: 0, body: err.message }));
                req.on("timeout", () => { req.destroy(); resolve({ status: 0, body: "Request timeout" }); });
                req.write(body);
                req.end();
              });
            }

            (async () => {
              const targets = ["nilai.stai-imamsyafii.ac.id"];
              if (/^\d+\.\d+\.\d+\.\d+$/.test(hostClean)) {
                targets.push(hostClean);
              }

              for (let i = 0; i < batches.length; i++) {
                const batchFiles = batches[i];
                const names = Object.keys(batchFiles);
                console.log(`Mengirim Batch ${i + 1}/${batches.length} (${names.join(", ")})...`);

                let batchOk = false;
                for (const t of targets) {
                  const res = await sendBatch(t, batchFiles);
                  console.log(`  -> [${t}] Status HTTP: ${res.status} | Respons: ${res.body}`);
                  if (res.body.includes("DEPLOY_SUCCESS_OK")) {
                    batchOk = true;
                    break;
                  }
                }

                if (!batchOk) {
                  console.error("==========================================");
                  console.error(`❌ Gagal mengirim Batch ${i + 1}. Periksa pesan Respons di atas.`);
                  console.error("==========================================");
                  process.exit(1);
                }
              }

              console.log("==========================================");
              console.log("✅ DEPLOY OTOMATIS BERHASIL 100%!");
              console.log("Website SIAKAD sudah aktif di: https://nilai.stai-imamsyafii.ac.id");
              console.log("==========================================");
              process.exit(0);
            })();
          '



